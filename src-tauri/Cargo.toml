[package]
name = "xpecs"
version = "0.1.1"
description = "Xpecs: portable system information, sensors and benchmarks"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
minisign-verify = "0.2"
base64 = "0.22"
wmi = "0.13"
nvml-wrapper = "0.10"
raw-cpuid = "11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
